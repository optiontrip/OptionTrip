<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#029e9d" />
    <meta name="color-scheme" content="light dark" />

    <!-- ── Core SEO ─────────────────────────────────────────────────────── -->
    <meta name="description" content="OptionTrip — powered by Travel Partner Vi. Describe your dream trip and get a personalized itinerary, flights, stays, activities, and single-day plans in minutes." />
    <meta name="keywords" content="AI travel planner, trip planning, itinerary generator, flight search, hotel search, car rental, plan my day, visa requirements, travel assistant, personalized travel, cheap flights, holiday planner" />
    <meta name="author" content="OptionTrip" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="OptionTrip" />
    <meta name="apple-mobile-web-app-title" content="OptionTrip" />
    <!-- No static canonical here: this one HTML file is served for every route, and a
         hardcoded canonical would be wrong for all pages but the homepage. Each page's
         real canonical is injected client-side by PageMeta/react-helmet-async. -->

    <!-- ── Open Graph (Facebook, LinkedIn, WhatsApp, iMessage) ─────────── -->
    <meta property="og:site_name" content="OptionTrip" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OptionTrip — Your Personal Travel Partner Vi" />
    <meta property="og:description" content="Describe your dream trip and get a personalized itinerary, flights, stays, and activities in minutes. Vi, your Travel Partner, keeps you smart from planning to landing." />
    <meta property="og:image" content="https://www.optiontrip.com/images/travel.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OptionTrip — travel planning platform" />
    <!-- og:url intentionally omitted here for the same reason as canonical above;
         PageMeta sets the correct one per route, and platforms fall back to the
         fetched URL when it's absent. -->
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@optiontrip" />
    <meta name="twitter:creator" content="@optiontrip" />
    <meta name="twitter:title" content="OptionTrip — Your Personal Travel Partner Vi" />
    <meta name="twitter:description" content="Describe your dream trip and get a personalized itinerary, flights, stays, and activities in minutes." />
    <meta name="twitter:image" content="https://www.optiontrip.com/images/travel.png" />
    <meta name="twitter:image:alt" content="OptionTrip — travel planning platform" />

    <!-- ── Icons + PWA ──────────────────────────────────────────────────── -->
    <link rel="shortcut icon" type="image/x-icon" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />

    <!-- ── Preconnect / DNS-prefetch to trim TTFB on external assets ────── -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://server.arcgisonline.com" />
    <link rel="dns-prefetch" href="https://api.open-meteo.com" />
    <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org" />

    <!-- ── Structured data: Organization + WebSite (SearchAction) ───────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OptionTrip",
      "url": "https://www.optiontrip.com/",
      "logo": "https://www.optiontrip.com/images/logo.png",
      "description": "Travel planning platform powered by Travel Partner Vi.",
      "sameAs": [
        "https://blog.optiontrip.com/",
        "https://twitter.com/optiontrip",
        "https://www.instagram.com/optiontrip",
        "https://www.facebook.com/optiontrip"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://www.optiontrip.com/contact",
        "availableLanguage": ["en"]
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OptionTrip",
      "url": "https://www.optiontrip.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.optiontrip.com/flights?origin={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "OptionTrip",
      "url": "https://www.optiontrip.com/",
      "image": "https://www.optiontrip.com/images/travel.png",
      "priceRange": "$$",
      "areaServed": "Worldwide"
    }
    </script>

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Leaflet (used by Plan My Day map). Free + no API key. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>

    <title>OptionTrip — Your Personal Travel Partner Vi</title>

    <!-- Travelpayouts Drive -->
    <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1" data-cmp-ab="2">
      (function () {
          var script = document.createElement("script");
          script.async = 1;
          script.setAttribute("data-cmp-ab","2");
          script.src = 'https://emrld.ltd/MTc2MjAy.js?t=176202';
          document.head.appendChild(script);
      })();
    </script>

    <!-- Google Analytics 4 — loads only when VITE_GA_MEASUREMENT_ID is set -->
    <script>
      (function() {
        var gid = '__VITE_GA_ID__'; // replaced at build time via vite.config
        if (!gid || gid === '__VITE_GA_ID__') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + gid;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){ window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', gid, { send_page_view: false });
      })();
    </script>

    <!-- Google Translate Element — hidden widget, auto-translates all page text -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false,
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>

    <!-- Suppress the Google Translate toolbar banner -->
    <style>
      body { top: 0 !important; }
      .goog-te-banner-frame { display: none !important; }
      .skiptranslate { display: none !important; }
      #google_translate_element { display: none !important; }
    </style>
  </head>

  <body>
    <!-- Hidden Google Translate widget mount point -->
    <div id="google_translate_element"></div>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
