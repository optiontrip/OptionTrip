name: Deploy Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: optiontrip-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Check backend JavaScript syntax
        run: |
          find Backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check Backend/scripts/printTravelNewsStatus.mjs

      - name: Location resolver regression checks
        working-directory: Backend
        run: npm run test:locations

      - name: Vi marketplace routing checks
        working-directory: Backend
        run: npm run test:vi-marketplace

      - name: Direct partner booking routing checks
        working-directory: Backend
        run: npm run test:partner-routing

      - name: Automatic Travelpayouts partner-link checks
        working-directory: Backend
        run: npm run test:partner-links

      - name: Site and travel-service integrity checks
        working-directory: Backend
        run: npm run test:site-services

      - name: Travel news runner checks
        working-directory: Backend
        run: npm run test:news-runner

      - name: Flight whole-month regression guard
        run: bash scripts/check-flight-search-integrity.sh

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Dynamic translation boundary checks
        working-directory: Frontend
        run: npm run test:translation-boundaries

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Verify build and integrity
        run: |
          test -s Frontend/dist/index.html
          grep -qi 'OptionTrip' Frontend/dist/index.html
          if grep -qE 'createRequire|_0x[0-9a-f]{4,}\(' Frontend/vite.config.js; then
            echo 'Unsafe injected code signature found in Frontend/vite.config.js'
            exit 1
          fi
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.js' --include='*.jsx' --include='*.html' 'optiontripcom@gmail.com' Frontend/src Frontend/index.html Backend/src; then
            echo 'Legacy public Gmail address found. Use info@optiontrip.com.'
            exit 1
          fi
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.js' --include='*.jsx' -E '20 Years Experiences|530 Tour Packages|850 Happy Customers|320 Award Winning|Sarah Chen|Michael Rodriguez' Frontend/src; then
            echo 'Fabricated template content found in production source.'
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 64.23.237.250
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd ~/OptionTrip
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            BACKUP_DIR="/var/backups/optiontrip/$(date +%Y%m%d-%H%M%S)"

            rollback() {
              exit_code=$?
              trap - ERR
              echo '❌ Deployment failed. Rolling back production...'

              cd ~/OptionTrip
              git reset --hard "$PREVIOUS_COMMIT"

              cd ~/OptionTrip/Backend
              npm ci
              pm2 restart optiontrip-backend --update-env || true

              if [ -d "$BACKUP_DIR/frontend" ]; then
                rm -rf /var/www/optiontrip/*
                cp -a "$BACKUP_DIR/frontend/." /var/www/optiontrip/
                chown -R www-data:www-data /var/www/optiontrip
                chmod -R 755 /var/www/optiontrip
              fi

              echo "↩️ Rolled back to $(git -C ~/OptionTrip rev-parse --short HEAD)"
              exit "$exit_code"
            }
            trap rollback ERR

            echo '📥 Syncing to origin/main (force-push safe)...'
            git merge --abort 2>/dev/null || true
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            echo "Deploying commit: $(git rev-parse --short HEAD) - $(git log -1 --pretty=%s)"

            echo '🔎 Integrity check...'
            if grep -qE "createRequire|_0x[0-9a-f]{4,}\(" Frontend/vite.config.js; then
              echo '❌ ABORT: vite.config.js contains injected code. Not building.'
              exit 1
            fi
            bash scripts/check-flight-search-integrity.sh

            echo '🧱 Preparing Backend dependencies...'
            cd ~/OptionTrip/Backend
            npm ci
            npm run test:locations
            npm run test:vi-marketplace
            npm run test:partner-routing
            npm run test:partner-links
            npm run test:site-services
            npm run test:news-runner

            echo '🎨 Testing and building Frontend before touching production...'
            cd ~/OptionTrip/Frontend
            npm ci
            npm run test:translation-boundaries
            npm run build
            test -s dist/index.html
            grep -qi 'OptionTrip' dist/index.html

            echo '💾 Backing up current Frontend...'
            mkdir -p "$BACKUP_DIR/frontend"
            if [ -d /var/www/optiontrip ]; then
              cp -a /var/www/optiontrip/. "$BACKUP_DIR/frontend/"
            fi

            echo '🚀 Restarting Backend...'
            cd ~/OptionTrip/Backend
            pm2 restart optiontrip-backend --update-env

            echo '🩺 Checking Backend health, travel news and marketplace inventory...'
            HEALTH_JSON="$(curl -fsS --retry 12 --retry-delay 2 --retry-connrefused --max-time 5 http://127.0.0.1:5000/api/health)"
            printf '%s' "$HEALTH_JSON" | grep -q '"status":"healthy"'
            printf '%s' "$HEALTH_JSON" | node ~/OptionTrip/Backend/scripts/printTravelNewsStatus.mjs

            # Give the startup partner-link warmup time to convert subscribed
            # Travelpayouts brands. This is observational, not a deploy blocker:
            # an unapproved brand must remain safely unavailable.
            sleep 4
            INVENTORY_JSON="$(curl -fsS --retry 8 --retry-delay 2 --retry-connrefused --max-time 5 http://127.0.0.1:5000/api/travel-inventory)"
            printf '%s' "$INVENTORY_JSON" | grep -q '"verticals"'
            printf '%s' "$INVENTORY_JSON" | node ~/OptionTrip/Backend/scripts/printAffiliateInventory.mjs

            echo '📦 Publishing Frontend...'
            rm -rf /var/www/optiontrip/*
            cp -a ~/OptionTrip/Frontend/dist/. /var/www/optiontrip/
            chown -R www-data:www-data /var/www/optiontrip
            chmod -R 755 /var/www/optiontrip

            echo '🌐 Running public smoke test...'
            PUBLIC_HTML="$(curl -fsSL --retry 8 --retry-delay 2 --retry-connrefused https://www.optiontrip.com/)"
            printf '%s' "$PUBLIC_HTML" | grep -qi 'OptionTrip'

            trap - ERR
            echo '✅ Deployment complete and smoke checks passed.'
            pm2 status

            echo '🧹 Keeping only the 5 newest Frontend backups...'
            ls -1dt /var/backups/optiontrip/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
