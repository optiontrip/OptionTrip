name: Validate Application

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Check backend JavaScript syntax
        run: find Backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Verify frontend artifact
        run: |
          test -s Frontend/dist/index.html
          grep -qi 'OptionTrip' Frontend/dist/index.html

      - name: Security integrity guard
        run: |
          if grep -qE 'createRequire|_0x[0-9a-f]{4,}\(' Frontend/vite.config.js; then
            echo 'Unsafe injected code signature found in Frontend/vite.config.js'
            exit 1
          fi

      - name: Product integrity guard
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.js' --include='*.jsx' --include='*.html' 'optiontripcom@gmail.com' Frontend/src Frontend/index.html Backend/src; then
            echo 'Legacy public Gmail address found. Use info@optiontrip.com.'
            exit 1
          fi

          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.js' --include='*.jsx' -E '20 Years Experiences|530 Tour Packages|850 Happy Customers|320 Award Winning' Frontend/src; then
            echo 'Fabricated template statistics found in production source.'
            exit 1
          fi

          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.js' --include='*.jsx' -E 'Sarah Chen|Michael Rodriguez' Frontend/src; then
            echo 'Fabricated testimonial content found in production source.'
            exit 1
          fi

          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.jsx' -E "href=['\"]#['\"]|to=['\"]#['\"]" Frontend/src; then
            echo 'Dead # navigation found in production UI. Use a real route or an action button.'
            exit 1
          fi

          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.jsx' -E '>Coming [Ss]oon<' Frontend/src; then
            echo 'User-facing Coming soon placeholder found. Route to Vi or a working service instead.'
            exit 1
          fi

          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.js' --include='*.jsx' -E 'Join thousands of travellers|Always see the best available price' Frontend/src; then
            echo 'Unsupported marketing claim found in production UI.'
            exit 1
          fi
