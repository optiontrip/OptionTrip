name: Validate Application

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Check backend JavaScript syntax
        run: find Backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Location resolver regression checks
        working-directory: Backend
        run: npm run test:locations

      - name: Landmark nearest-airport checks
        working-directory: Backend
        run: npm run test:landmarks

      - name: Selected-language location search checks
        working-directory: Backend
        run: npm run test:localized-locations

      - name: Car-rental unified routing checks
        working-directory: Backend
        run: npm run test:cars

      - name: Vi marketplace routing checks
        working-directory: Backend
        run: npm run test:vi-marketplace

      - name: Vi live conversion handoff checks
        working-directory: Backend
        run: npm run test:vi-conversion

      - name: Direct partner booking routing checks
        working-directory: Backend
        run: npm run test:partner-routing

      - name: Automatic Travelpayouts partner-link checks
        working-directory: Backend
        run: npm run test:partner-links

      - name: Resilient live widget fallback checks
        working-directory: Backend
        run: npm run test:widget-fallbacks

      - name: Country-to-country flight matrix checks
        working-directory: Backend
        run: npm run test:flight-country-matrix

      - name: Whole Month URL contract checks
        working-directory: Backend
        run: npm run test:whole-month-contract

      - name: Site and travel-service integrity checks
        working-directory: Backend
        run: npm run test:site-services

      - name: Deployment affiliate reporter check
        run: |
          printf '%s' '{"verticals":[{"vertical":"bus","live":true,"providers":["twelve_go"],"bookingOptions":[{"provider":"twelve_go","url":"https://example.test"}]},{"vertical":"city_passes","live":true,"providers":["go_city"],"bookingOptions":[{"provider":"go_city","url":"https://example.test"}]}]}' | node Backend/scripts/printAffiliateInventory.mjs | tee /tmp/affiliate-status.txt
          grep -q 'affiliate-status bus: live=true liveProviders=twelve_go bookingProviders=twelve_go' /tmp/affiliate-status.txt
          grep -q 'affiliate-status city_passes: live=true liveProviders=go_city bookingProviders=go_city' /tmp/affiliate-status.txt

      - name: Travel news runner checks
        working-directory: Backend
        run: npm run test:news-runner

      - name: Flight whole-month regression guard
        run: bash scripts/check-flight-search-integrity.sh

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Dynamic translation boundary checks
        working-directory: Frontend
        run: npm run test:translation-boundaries

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Verify frontend artifact
        run: |
          test -s Frontend/dist/index.html
          grep -qi 'OptionTrip' Frontend/dist/index.html

      - name: Security integrity guard
        run: |
          if grep -qE 'createRequire|_0x[0-9a-f]{4,}\(' Frontend/vite.config.js; then
            echo 'Unsafe injected code signature found in Frontend/vite.config.js'
            exit 1
          fi

      - name: Product integrity guard
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.js' --include='*.jsx' --include='*.html' 'optiontripcom@gmail.com' Frontend/src Frontend/index.html Backend/src; then
            echo 'Legacy public Gmail address found. Use info@optiontrip.com.'
            exit 1
          fi

          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.js' --include='*.jsx' -E '20 Years Experiences|530 Tour Packages|850 Happy Customers|320 Award Winning' Frontend/src; then
            echo 'Fabricated template statistics found in production source.'
            exit 1
          fi

          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --include='*.js' --include='*.jsx' -E 'Sarah Chen|Michael Rodriguez' Frontend/src; then
            echo 'Fabricated testimonial content found in production source.'
            exit 1
          fi
